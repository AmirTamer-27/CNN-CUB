# Same-FC objective: cross-entropy + cosine_weight * cosine loss.
# train_loss/val_loss remain CE; the scheduler monitors val_loss.
run_name: scratch_delayed_pooling_cutout_lr_combined_loss_320_70
model: bird_cnn_delayed_pooling
num_classes: 200
train_dataset: Multimodal-Fatima/CUB_train
validation_fraction: 0.2
seed: 42
image_size: 320
batch_size: 32
epochs: 70
optimizer: adam
dropout: 0.3
learning_rate: 0.001
lr_scheduler: plateau
lr_plateau_factor: 0.5
lr_plateau_patience: 5
lr_plateau_threshold: 0.001
lr_plateau_min_lr: 1.0e-06
weight_decay: 0.0001
horizontal_flip_probability: 0.5
contrast_change_probability: 0.5
contrast_strength: 0.2
cutout_probability: 0.5
cutout_min_fraction: 0.25
cutout_max_fraction: 0.3
loss: combined
cosine_weight: 1.0
