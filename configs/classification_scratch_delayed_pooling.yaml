# Only the first pooling stride changes; training settings match the regularized baseline.
run_name: scratch_delayed_pooling_a_d_evenLowerReg_40_lowerLR
model: bird_cnn_delayed_pooling
num_classes: 200
train_dataset: Multimodal-Fatima/CUB_train
validation_fraction: 0.2
seed: 42
image_size: 224
batch_size: 32
epochs: 40
optimizer: adam
dropout: 0.3
learning_rate: 0.01
weight_decay: 0.00001
horizontal_flip_probability: 0.5
contrast_change_probability: 0.5
contrast_strength: 0.2
