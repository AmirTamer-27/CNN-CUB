# Same settings as the 320px delayed-pooling run; only the classifier changes.
run_name: scratch_multidepth_bestSettings_320
model: bird_cnn_multidepth
num_classes: 200
train_dataset: Multimodal-Fatima/CUB_train
validation_fraction: 0.2
seed: 42
image_size: 320
batch_size: 32
epochs: 50
optimizer: adam
dropout: 0.3
learning_rate: 0.001
weight_decay: 0.0001
horizontal_flip_probability: 0.5
contrast_change_probability: 0.5
contrast_strength: 0.2
