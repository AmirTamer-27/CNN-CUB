# Simple attention experiment, not a WS-DAN reproduction.
# Dropout/weight decay removed; augmentation retained.
run_name: scratch_attention_320_70_no_decay_no_dropout
model: bird_cnn_attention
num_classes: 200
train_dataset: Multimodal-Fatima/CUB_train
validation_fraction: 0.2
seed: 42
image_size: 320
batch_size: 32
epochs: 70
optimizer: adam
dropout: 0.0
learning_rate: 0.001
weight_decay: 0.0
horizontal_flip_probability: 0.5
contrast_change_probability: 0.5
contrast_strength: 0.2
